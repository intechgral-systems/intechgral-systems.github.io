<h1>プライバシーポリシー</h1>
<p>最終更新日: 2026年10月12日</p>
<p>株ダービー(以下「本アプリ」)は、運営者が自身の YouTube チャンネルへ動画を投稿するために使う個人用ツールです。</p>
<h2>1. 取得する情報</h2>
<p>本アプリは、Google アカウントの認証(OAuth)を通じて、YouTube Data API の youtube.upload 権限(動画のアップロード)のみを取得します。氏名、メールアドレス、連絡先、視聴履歴など、その他の個人情報は取得しません。</p>
<h2>2. 利用目的</h2>
<p>取得した権限は、本アプリが作成した動画を運営者自身の YouTube チャンネルへアップロードするためだけに使います。</p>
<h2>3. 保存と管理</h2>
<p>認証トークンは運営者のパソコン内にのみ保存し、外部のサーバーへ送信・共有・販売することはありません。</p>
<h2>4. 第三者への提供</h2>
<p>取得した情報を第三者に提供することはありません。</p>
<h2>5. Google API の利用について</h2>
<p>本アプリによる Google API から受け取った情報の使用および他のアプリへの転送は、<a href="https://developers.google.com/terms/api-services-user-data-policy">Google API サービスのユーザーデータに関するポリシー</a>(限定的使用の要件を含む)に準拠します。</p>
<h2>6. 権限の取り消し</h2>
<p>Google アカウントの<a href="https://myaccount.google.com/connections">「サードパーティ製のアプリとサービス」</a>から、いつでも本アプリへのアクセスを取り消せます。</p>
